<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#e0e0e0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Put your screenshots on 3D devices and turn them into promo videos, right in the browser. Free and fair source." />
    <meta property="og:title" content="OpenMock" />
    <meta property="og:description" content="Put your screenshots on 3D devices and turn them into promo videos, right in the browser." />
    <meta property="og:image" content="https://openmock.app/og-card.png" />
    <meta property="og:url" content="https://openmock.app" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://openmock.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>OpenMock: 3D device mockups and promo videos in your browser</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>OpenMock</h1>
      <p>
        OpenMock puts your screenshots and screen recordings on 3D devices such as iPhone, iPad, MacBook and
        Apple Watch, lets you add camera moves, depth of field and effects, animate everything on a keyframe
        timeline, and export images or MP4 promo videos. It runs entirely in your browser and requires
        JavaScript and WebGL.
      </p>
      <p><a href="https://github.com/mehrantsi/openmock">Source code on GitHub</a></p>
    </noscript>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "OpenMock",
      "url": "https://openmock.app",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web browser",
      "description": "Put your screenshots on 3D devices and turn them into promo videos, right in the browser. Free and fair source.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "image": "https://openmock.app/og-card.png",
      "softwareHelp": "https://github.com/mehrantsi/openmock"
    }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
